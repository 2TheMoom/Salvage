<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Desktop Chrome auto-sizes the popup window to the document's natural
     size, so min-height:100% resolves to just the content's own height
     there (no established viewport to be a percentage of yet) — this only
     actually does something on hosts that render the popup as a full-size
     panel instead (seen on mobile/Kiwi Browser), where it centers the
     content instead of leaving it pinned to the top-left of empty space. */
  html { height: 100%; }
  body {
    min-height: 100%; margin: 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f11; color: #f2f2f2;
  }
  .popup-content { width: 280px; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  input {
    width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #333; background: #1a1a1d; color: #f2f2f2; font-size: 13px;
    margin-bottom: 10px;
  }
  #result { font-size: 13px; line-height: 1.5; min-height: 18px; }
  .safe { color: #4ade80; }
  .warn { color: #fb923c; }
  .muted { color: #888; }
  a { color: #93c5fd; }
</style>
</head>
<body>
  <div class="popup-content">
    <h1><img src="icons/icon48.png" alt="" />Salvage</h1>
    <input id="address" type="text" placeholder="Paste an address to check…" autofocus />
    <div id="result" class="muted">Checks if it's a wallet or a contract.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
